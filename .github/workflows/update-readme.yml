name: Refresh README activity

# Rewrites the "Recent Activity" and "Latest Repos" blocks in the README.
on:
  schedule:
    - cron: "30 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/update_readme.py, .github/workflows/update-readme.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: python3 scripts/update_readme.py README.v2.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if anything changed
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: refresh README activity"
          git push
